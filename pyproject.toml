[project]
name = "python-sdks"
version = "0.1.0"
description = "LiveKit Python SDKs monorepo"
requires-python = ">=3.9"
dependencies = ["livekit", "livekit-api", "livekit-protocol"]

[tool.uv]
# Security floors for transitive development and release dependencies.
constraint-dependencies = [
    "cryptography>=50.0.0",
    "filelock>=3.20.3",
    "pillow>=12.3.0",
    "pygments>=2.20.0",
    "urllib3>=2.8.0",
]

[tool.uv.dependency-groups]
# Patched tooling requires Python 3.10; published SDKs still support Python 3.9.
dev = { requires-python = ">=3.10" }

[tool.uv.workspace]
members = ["livekit-rtc", "livekit-api", "livekit-protocol"]

[tool.uv.sources]
livekit = { workspace = true }
livekit-api = { workspace = true }
livekit-protocol = { workspace = true }

[dependency-groups]
dev = [
    # Linting and type checking
    "ruff>=0.8.5",
    "mypy>=1.13.0",
    "types-aiofiles>=24",
    "ipython>=8.0.0",
    # Testing
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    # Build and packaging
    "requests>=2.33.0",
    "wheel",
    "twine",
    "auditwheel; sys_platform == 'linux'",
    "cibuildwheel",
    # Additional dependencies
    "matplotlib",
    "pydantic",
    "numpy",
]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [".github"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["livekit"]

[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--import-mode=importlib", "--ignore=examples"]


[tool.mypy]
exclude = "(build|setup\\.py|livekit-rtc/rust-sdks.*)"
namespace_packages = true
explicit_package_bases = true
mypy_path = "livekit-protocol:livekit-api:livekit-rtc"
strict = true
disallow_any_generics = false
plugins = ["pydantic.mypy"]
