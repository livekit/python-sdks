          required: true
          schema:
            type: string
            title: project_id
        - name: simulationRunId
          in: path
          description: The simulationRunId path parameter.
          required: true
          schema:
            type: string
            title: simulation_run_id
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                codeEntrypoint:
                  type: string
                  title: code_entrypoint
                  description: The entrypoint of the uploaded source, for example `agent.py`.
              title: Request
              additionalProperties: false
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/livekit.publicapi.simulations.v1.SimulationRuns.ConfirmSourceUpload.Response'
        default:
