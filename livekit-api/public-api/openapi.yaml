        email:
          type: string
          title: email
          description: The email address of the invited person.
      title: DeleteInviteRequest
      additionalProperties: false
    livekit.publicapi.workspaces.v1.DeleteInviteResponse:
      type: object
      title: DeleteInviteResponse
      additionalProperties: false
    livekit.publicapi.workspaces.v1.DeleteMemberRequest:
      type: object
      properties:
        workspaceId:
          type: string
          title: workspace_id
          description: The workspace ID (`wo_...`).
        userId:
          type: string
          title: user_id
          description: The ID of the user.
        confirmedNumKeys:
          type: integer
          title: confirmed_num_keys
          description: |-
            The number of the member's API keys that you agree to delete. Send `0`
             first. When the member owns API keys, the call fails with
             `FailedPrecondition` and a `MemberRemovalNotConfirmed` detail. Show its
             `numKeys` to the user, then send the request again with that number.
      title: DeleteMemberRequest
      additionalProperties: false
    livekit.publicapi.workspaces.v1.DeleteMemberResponse:
      type: object
      properties:
        numKeys:
          type: integer
          title: num_keys
          description: The number of API keys that the removal deleted, not counting agent keys.
      title: DeleteMemberResponse
      additionalProperties: false
    livekit.publicapi.workspaces.v1.DeleteProjectRequest:
      type: object
      properties:
        workspaceId:
          type: string
          title: workspace_id
          description: The workspace ID (`wo_...`).
        projectId:
          type: string
          title: project_id
          description: The project ID (`p_...`).
      title: DeleteProjectRequest
      additionalProperties: false
    livekit.publicapi.workspaces.v1.DeleteWorkspaceRequest:
