    livekit.publicapi.projects.v1.ListProjectsRequest:
      type: object
      properties:
        page:
          allOf:
            - $ref: '#/components/schemas/livekit.publicapi.common.v1.PageRequest'
          title: page
          description: |-
            The page to return. `pageSize` defaults to 100, and the API clamps a
             larger value to 1000. A malformed cursor returns `InvalidArgument`.
        workspaceId:
          type: string
          title: workspace_id
