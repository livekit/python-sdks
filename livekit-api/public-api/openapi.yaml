          description: |-
            The API key of this project whose secret signs the deliveries. When unset
             or empty, the signing key does not change.
        filterParams:
          allOf:
            - $ref: '#/components/schemas/livekit.FilterParams'
          title: filter_params
          description: |-
            The names of the events to deliver. A set filter replaces the whole
