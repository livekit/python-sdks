          title: commit_sha
        ref:
          type: string
          title: ref
          description: branch or tag
        pullRequest:
          type: string
          title: pull_request
        runUrl:
          type: string
          title: run_url
          description: link back to the CI job
        actor:
          type: string
          title: actor
      title: CI
      additionalProperties: false
      description: |-
        The pipeline this run came from. Set by the client from its CI
         environment; absent for runs not started by a pipeline.
