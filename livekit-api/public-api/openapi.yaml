        url:
          type: string
          title: url
          description: The URL that receives the events.
        signingKey:
          type: string
          title: signing_key
          description: |-
            The API key of this project whose secret signs each delivery. It is a key
             ID, not a secret. Empty signs with the oldest key in the project.
        filterParams:
          allOf:
            - $ref: '#/components/schemas/livekit.FilterParams'
          title: filter_params
          description: |-
            The events to send, named by `includeEvents` or `excludeEvents`. Read the
             names from List webhook events.
      title: Webhook
      additionalProperties: false
      description: A webhook destination of a project.
