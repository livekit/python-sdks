tags:
  - name: BuilderAgentService
    description: |-
      Makes and deploys voice agents from a configuration, with no code to write.
       LiveKit generates the agent code from the configuration and runs it on
       LiveKit Cloud. Agent Builder in the dashboard shows the same agents, so you
       can continue in the dashboard at any time.

       A builder agent registers under its name. To send it to a room, dispatch
       that name, as for any agent. To test it with a simulation run, use the same
       name as the `agentName` of the run.

       The reads (`GetBuilderAgent` and `ListBuilderAgents`) require the `READ`
       role on the project. The writes (`CreateBuilderAgent`, `UpdateBuilderAgent`,
       `DeployBuilderAgent`, and `DeleteBuilderAgent`) require the `WRITE` role. A
       project that you cannot see returns `NotFound`. A project that you can see,
       but without the necessary role, returns `PermissionDenied`.
  - name: AnalyticsService
    description: |-
      Reads the analytics of a project: its room sessions, with their
       participants and events. This is the data that the LiveKit Cloud dashboard
       shows.

       Each RPC requires the read role on the project. The transcripts, logs,
       traces, metrics, and recordings of a session are in `ObservabilityService`,
       which requires the admin role.
  - name: DatabaseService
    description: |-
      Manages the agent databases of a project. An agent database is a SQLite
       database that an agent keeps across sessions. LiveKit stores it durably in
       the data region of the project. Queries do not use this service: they run
       over the WebSocket connection at `/v0/agentstore/db`.

       Each RPC accepts a LiveKit access token for the project with the agent
       `databaseAdmin` grant. A signed-in user needs the `READ` role on the project
       for `GetDatabase`, `ListDatabases`, and `ExportDatabase`, and the `WRITE`
       role for `CreateDatabase` and `DeleteDatabase`.
  - name: ObservabilityService
    description: |-
      Reads the raw observability data of a session. The session ID is the room
       session ID (`RM_...`), the same ID that `AnalyticsService` returns as
       `sessionId`.
  - name: ProjectService
    description: |-
      Manages LiveKit Cloud projects, with their members, invites, API keys,
       access tokens, and webhooks.
  - name: SimulationService
    description: |-
      Runs agent simulations against the agent of a project and returns their
       graded outcomes. Each job puts a simulated user in a room with the agent
       under test. The job dispatches the agent by `agentName`, so the agent must be
       deployed or running as a worker before the run starts.

       Runs are asynchronous. `CreateSimulationRun` returns a run ID. A run starts
       in one of two ways:

       - With a `scenarioGroup`, the run starts immediately (`RUNNING`) and plays
         only those scenarios.
       - Without a `scenarioGroup`, the API generates `numSimulations` scenarios
         from the agent source code. The run waits in `PENDING_UPLOAD` until you
         upload the source to the returned presigned POST and call
         `ConfirmSimulationSourceUpload`. The run then goes to `GENERATING`, then
         to `RUNNING`. The API reads the source only to write scenarios. The source
         is not the agent under test.

       To read the outcome, call `GetSimulationRun` and `GetSimulationRunSummary`.

       The reads (`GetSimulationRun`, `ListSimulationRuns`, `CountSimulationRuns`,
       and `GetSimulationRunSummary`) require the `READ` role on the project. The
       writes (`CreateSimulationRun`, `ConfirmSimulationSourceUpload`,
       `CancelSimulationRun`, and `GenerateScenarioFromSession`) require the
       `WRITE` role. A project that you cannot see returns `NotFound`. A project
       that you can see, but without the necessary role, returns
       `PermissionDenied`.
  - name: ThreadService
    description: |-
      Manages the agent threads of a project. A thread is the durable conversation
       that an agent has with a person, across channels and over time. Its ID
       starts with `AT_`. Each thread has its own database, which the API creates
       with the thread.

       Each RPC accepts a LiveKit access token for the project when its
       `agentThread` grant allows the action. The grant allows `ListThreads` and
       `CreateThread` by scope, and `GetThread`, `GetThreadItems`,
       `GetThreadTasks`, and `DeleteThread` by thread ID. With `all`, the grant
       allows each action on each thread. A signed-in user needs the `READ` role on
       the project for `GetThread`, `ListThreads`, `GetThreadItems`, and
       `GetThreadTasks`, and the `WRITE` role for the other RPCs.
  - name: UserService
    description: 'Returns LiveKit Cloud users: you, or the members of a project or workspace.'
  - name: WorkspaceService
    description: Manages LiveKit Cloud workspaces, with their members, invites, and projects.
