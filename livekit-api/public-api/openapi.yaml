  /v0/projects/{projectId}/sessions:
    get:
      tags:
        - AnalyticsService
      summary: ListProjectSessions
      description: Lists the room sessions of a project, newest first.
      operationId: AnalyticsService_ListProjectSessions
      parameters:
        - name: projectId
          in: path
          description: The project ID (`p_...`).
          required: true
          schema:
            type: string
            title: project_id
        - name: page.cursor
          in: query
          description: |-
            The cursor of the page to return: the `nextCursor` of the previous page.
             When empty, the list starts at the first item.
          schema:
            type: string
            title: cursor
        - name: page.pageSize
          in: query
          description: |-
            The maximum number of items to return. When 0, the list uses its default
             page size.
          schema:
            type: integer
            title: page_size
            format: int32
        - name: filter.range.startTime
          in: query
          description: The start of the range, included. Unset means 24 hours before the end.
          schema:
            type: string
            examples:
              - "2023-01-15T01:30:15.01Z"
              - "2024-12-25T12:00:00Z"
            format: date-time
        - name: filter.range.endTime
          in: query
          description: The end of the range, excluded. Unset means now.
          schema:
            type: string
            examples:
              - "2023-01-15T01:30:15.01Z"
              - "2024-12-25T12:00:00Z"
            format: date-time
        - name: filter.statuses
          in: query
          description: |-
            The statuses to match. A session matches when it has one of the statuses.
             When empty, a session with any status matches.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/livekit.publicapi.analytics.v1.SessionStatus'
            title: statuses
        - name: filter.roomName
          in: query
          description: |-
            A prefix of the room name. Returns only the sessions whose room name
             starts with this value. The match is case-sensitive. For example, `demo-`
             matches `demo-1` and `demo-lobby`.
          schema:
            type: string
            title: room_name
        - name: filter.sessionId
          in: query
          description: |-
            The ID of a room session (`RM_...`). Returns only the session with this
             exact ID.
          schema:
            type: string
            title: session_id
        - name: filter.tags
          in: query
          description: The tags to match. A session matches when it has one of the tags.
          schema:
            type: array
            items:
              type: string
            title: tags
        - name: filter.agentId
          in: query
          description: |-
            The ID of a cloud agent (`CA_...`). Returns only the sessions that this
             agent served.
          schema:
            type: string
            title: agent_id
        - name: sortOrder
          in: query
          description: |-
            The sort direction of `startedAt`. Sessions sort only on `startedAt`.
             Defaults to descending (newest first).
          schema:
            allOf:
              - $ref: '#/components/schemas/livekit.publicapi.common.v1.SortOrder'
            title: sort_order
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/livekit.publicapi.analytics.v1.Sessions.List.Response'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
