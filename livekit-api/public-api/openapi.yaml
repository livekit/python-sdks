openapi: 3.1.0
info:
  title: LiveKit Cloud API
  version: v0
  description: |-
    Use this API to manage LiveKit Cloud resources, such as workspaces,
    projects, and users, and to read analytics and observability data for your
    sessions.

    This is the pre-GA `v0` API. Endpoints, fields, and the version prefix can
    change at any time. `v1` is reserved for the first stable release.

    ## Authentication

    Send a token as a bearer token in the `Authorization` header of each
    request:

    ```
    Authorization: Bearer <token>
    ```

    Operations require a user session token.

    If the token is missing or isn't valid, the API returns `401` and a
    `WWW-Authenticate: Bearer` header.

    Your role in the workspace or project controls which operations you can
    use. The roles are `1` (read), `2` (write), and `3` (admin). A pending
    invitee holds `0` until they accept the invite.

    A role too low for an operation gets `403`. A workspace or project you
    aren't a member of gets `404`.

    ## Errors

    Every error returns a `google.rpc.Status` object:

    ```json
    {
      "code": 5,
      "message": "project not found",
      "details": []
    }
    ```

    The `code` field is a
    [google.rpc.Code](https://grpc.io/docs/guides/status-codes/), not an HTTP
    status. The API sets the HTTP status from `code`:

    | Code | Name | HTTP |
    | --- | --- | --- |
    | 1 | Cancelled | 499 |
    | 3, 9, 11 | InvalidArgument, FailedPrecondition, OutOfRange | 400 |
    | 16 | Unauthenticated | 401 |
    | 7 | PermissionDenied | 403 |
    | 5 | NotFound | 404 |
    | 6, 10 | AlreadyExists, Aborted | 409 |
    | 8 | ResourceExhausted | 429 |
    | 2, 13, 15 | Unknown, Internal, DataLoss | 500 |
    | 12 | Unimplemented | 501 |
    | 14 | Unavailable | 503 |
    | 4 | DeadlineExceeded | 504 |

    Some HTTP statuses apply to more than one code. To identify an error from
    an operation, use `code`, not the HTTP status.

    Each response also includes an `X-Request-Id` header. If you need to
    report a problem, include this value.

    ## Default values

    Responses include every field that isn't optional, even when it holds its
    default value: `false`, `0`, an empty string, or an empty list. Responses
    leave out an optional field that isn't set and an object that isn't set.
    An absent field means that the value isn't set.

    ## Pagination

    Some operations return results in pages. These operations take the
    `page.cursor` and `page.pageSize` query parameters, and the response
    includes a `pageInfo` object.

    To get the next page, send the value of `pageInfo.nextCursor` as
    `page.cursor`. A cursor is opaque: send it back exactly as you got it, and
    don't build or parse a cursor yourself. The `pageInfo.hasMore` property
    tells you whether another page follows. On the last page,
    `pageInfo.hasMore` is `false` and `pageInfo.nextCursor` is an empty string.

    Send the same filter parameters with the cursor that you sent on the first
    request. A cursor isn't valid against a different set of filters.

    Operations that don't take these parameters return all items in one
    response.
