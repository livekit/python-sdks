              schema:
                $ref: '#/components/schemas/google.rpc.Status'
  /v0/projects/{projectId}/sessions/{sessionId}/traces:
    get:
      tags:
        - ObservabilityService
      summary: |-
        Returns the spans that the agents of a session exported, ordered by start
         time. These are the spans that the trace view on the dashboard shows. Each
         span names its parent, so you can build the span tree from the pages. The
         attributes of a span hold the turn and latency fields that the turn view on
         the dashboard uses, such as `lk.generation_id` and `lk.response.ttft`.
      description: |-
        An `ACTIVE` session returns the spans that its agents exported up to now. A
         span exported after the first page appears only in a new read. The API
         reads the later pages by offset, so a span exported during your read can
         move them. Thus, a span can repeat, or a page can skip a span. Remove
         duplicates by `spanId`. To get a skipped span, read again from the first
         page. An unknown session returns `NotFound`.
      operationId: ObservabilityService_GetSessionTraces
      parameters:
        - name: projectId
          in: path
          description: The project ID (`p_...`).
          required: true
          schema:
            type: string
            title: project_id
        - name: sessionId
          in: path
          description: The session ID (`RM_...`).
          required: true
          schema:
            type: string
            title: session_id
        - name: page.cursor
          in: query
          description: |-
            The cursor of the page to return: the `nextCursor` of the previous page.
             When empty, the list starts at the first item.
          schema:
            type: string
            title: cursor
        - name: page.pageSize
          in: query
          description: |-
            The maximum number of items to return. When 0, the list uses its default
             page size.
          schema:
            type: integer
            title: page_size
            format: int32
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/livekit.publicapi.observability.v1.Traces.Get.Response'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
  /v0/projects/{projectId}/sessions/{sessionId}/transcript:
    get:
      tags:
        - ObservabilityService
      summary: |-
        Returns the conversation of a session as ordered transcript items. The
         items are messages, tool calls and results, agent handoffs, and agent
         configuration changes. It is the conversation that the transcript on the
         dashboard shows.
      description: |-
        The agent exports its transcript when the session ends. There is a delay
         before you can read it, and the length of the delay is not fixed. On a
         project with PII redaction, you can read it only after LiveKit redacts the
         session recording. Thus, an `ACTIVE` session returns the items that exist,
         usually none, with no error. Read it again after the session ends. An
         unknown session returns `NotFound`.
      operationId: ObservabilityService_GetSessionTranscript
      parameters:
        - name: projectId
          in: path
          description: The project ID (`p_...`).
          required: true
          schema:
            type: string
            title: project_id
        - name: sessionId
          in: path
          description: The session ID (`RM_...`).
          required: true
          schema:
            type: string
            title: session_id
        - name: page.cursor
          in: query
          description: |-
            The cursor of the page to return: the `nextCursor` of the previous page.
             When empty, the list starts at the first item.
          schema:
            type: string
            title: cursor
        - name: page.pageSize
          in: query
          description: |-
            The maximum number of items to return. When 0, the list uses its default
             page size.
          schema:
            type: integer
            title: page_size
            format: int32
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/livekit.publicapi.observability.v1.Transcript.Get.Response'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
  /v0/projects/{projectId}/simulation-runs:
    get:
      tags:
        - SimulationService
      summary: ListSimulationRuns
      description: |-
        Lists the runs of a project, newest first. You can filter the runs by
         status, agent, conversation mode, and time window. Each run includes its
         counts (`jobCount`, `passedCount`, `failedCount`, and `issueCount`), but
         not its jobs or its summary.
      operationId: SimulationService_ListSimulationRuns
      parameters:
        - name: projectId
          in: path
          description: The projectId path parameter.
          required: true
          schema:
            type: string
            title: project_id
        - name: page.cursor
          in: query
          description: |-
            The cursor of the page to return: the `nextCursor` of the previous page.
             When empty, the list starts at the first item.
          schema:
            type: string
            title: cursor
        - name: page.pageSize
          in: query
          description: |-
            The maximum number of items to return. When 0, the list uses its default
             page size.
          schema:
            type: integer
            title: page_size
            format: int32
        - name: status
          in: query
          description: A run status. Returns only the runs in this status.
          schema:
            oneOf:
              - $ref: '#/components/schemas/livekit.SimulationRun.Status'
              - type: "null"
            title: status
        - name: agentName
          in: query
          description: |-
            An agent name. Returns only the runs of the agent with this exact
             name.
          schema:
            type: string
            title: agent_name
        - name: startTime
          in: query
          description: |-
            The start of the window on the creation time of the run, inclusive.
             When unset, the window starts 45 days before `endTime`. The window can
             be at most 45 days. A longer window returns `InvalidArgument`.
          schema:
            type: string
            examples:
              - "2023-01-15T01:30:15.01Z"
              - "2024-12-25T12:00:00Z"
            format: date-time
        - name: endTime
          in: query
          description: |-
            The end of the window on the creation time of the run, exclusive.
             When unset, the window ends now.
          schema:
            type: string
            examples:
              - "2023-01-15T01:30:15.01Z"
              - "2024-12-25T12:00:00Z"
            format: date-time
        - name: mode
          in: query
          description: A conversation mode. Returns only the runs in this mode.
          schema:
            oneOf:
              - $ref: '#/components/schemas/livekit.SimulationMode'
              - type: "null"
            title: mode
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/livekit.publicapi.simulations.v1.SimulationRuns.List.Response'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
    post:
      tags:
        - SimulationService
      summary: CreateSimulationRun
      description: |-
        Creates a simulation run. With a `scenarioGroup`, the run starts
         immediately and the response has no upload target. Without a
         `scenarioGroup`, the run waits in `PENDING_UPLOAD` for the agent source
         that the API generates scenarios from. Upload the source to the returned
         presigned POST, then call `ConfirmSimulationSourceUpload`. A run that stays
         pending for one hour fails. This RPC is not idempotent: a retry starts a
         second run.
      operationId: SimulationService_CreateSimulationRun
      parameters:
        - name: projectId
          in: path
          description: The projectId path parameter.
          required: true
          schema:
            type: string
            title: project_id
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                agentName:
                  type: string
                  title: agent_name
                  description: |-
                    The name of the agent under test. Each job dispatches this agent into
                     the simulation room, so the agent must be deployed or running as a
                     worker. When empty, the run uses the default agent of the project. The
                     run records the name, and `ListSimulationRuns` can filter on it.
                numSimulations:
                  type: integer
                  title: num_simulations
                  format: int32
                  description: |-
                    The number of scenarios to generate from the agent source when
                     `scenarioGroup` is unset.
                region:
                  type: string
                  title: region
                  description: Reserved. Must be empty. The API chooses where the run happens.
                scenarioGroup:
                  oneOf:
                    - $ref: '#/components/schemas/livekit.ScenarioGroup'
                    - type: "null"
                  title: scenario_group
                  description: |-
                    The scenarios to run, with the contents of a `scenarios.yaml` file.
                     When set, the run plays only these scenarios and does not generate
                     `numSimulations` scenarios. The run needs no source upload and starts
                     immediately.
                concurrency:
                  type:
                    - integer
                    - "null"
                  title: concurrency
                  format: int32
                  description: |-
                    The maximum number of jobs that run in parallel. The maximum value is
                     20. A larger value returns `InvalidArgument`. The concurrency quota of
                     the project can run fewer jobs at a time. When unset, the API uses its
                     default.
                mode:
                  allOf:
                    - $ref: '#/components/schemas/livekit.SimulationMode'
                  title: mode
                  description: The conversation mode of each job. Unset means `TEXT`.
                backgroundNoise:
                  type: boolean
                  title: background_noise
                  description: |-
                    When true, the simulated user has background noise. Applies only in
                     `AUDIO` mode.
                lowQualityMicrophone:
                  type: boolean
                  title: low_quality_microphone
                  description: |-
                    When true, the simulated user has a low-quality microphone. Applies
                     only in `AUDIO` mode.
                packetLoss:
                  type: boolean
                  title: packet_loss
                  description: |-
                    When true, the audio of the simulated user has packet loss. Applies
                     only in `AUDIO` mode.
                ci:
                  oneOf:
                    - $ref: '#/components/schemas/livekit.SimulationRun.CI'
                    - type: "null"
                  title: ci
                  description: |-
                    The CI pipeline that started the run. Use it to link a run to its
                     commit.
              title: Request
              additionalProperties: false
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/livekit.publicapi.simulations.v1.SimulationRuns.Create.Response'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
  /v0/projects/{projectId}/simulation-runs/{simulationRunId}:
