      summary: GetSessionRecordingURL
      description: |-
        Returns a short-lived signed URL for a session recording: its audio
         or its chat history. A session with no recording of that type returns
         `NotFound`. A new recording can return `NotFound` for up to one minute
         after the session ends.
      operationId: ObservabilityService_GetSessionRecordingURL
      parameters:
        - name: projectId
          in: path
          description: The project ID (`p_...`).
