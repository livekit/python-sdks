    livekit.publicapi.workspaces.v1.UpdateMemberRequest:
      type: object
      properties:
        workspaceId:
          type: string
          title: workspace_id
          description: The workspace ID (`wo_...`).
        userId:
          type: string
          title: user_id
          description: The ID of the user.
        role:
          type: integer
          title: role
          format: int32
          description: 'Access level to grant: 1 read, 2 write, 3 admin.'
      title: UpdateMemberRequest
      additionalProperties: false
    livekit.publicapi.workspaces.v1.UpdateMemberResponse:
      type: object
      properties:
        member:
          allOf:
            - $ref: '#/components/schemas/livekit.publicapi.workspaces.v1.WorkspaceMember'
          title: member
      title: UpdateMemberResponse
      additionalProperties: false
    livekit.publicapi.workspaces.v1.UpdateWorkspaceRequest:
      type: object
      properties:
        workspaceId:
          type: string
          title: workspace_id
          description: The workspace ID (`wo_...`).
        name:
          type:
            - string
            - "null"
          title: name
          description: The workspace name.
      title: UpdateWorkspaceRequest
      additionalProperties: false
      description: |-
        The changes to a workspace. You can change only `name`. LiveKit staff set
         the workspace `preferences`, which apply to every project in the workspace.
    livekit.publicapi.workspaces.v1.UpdateWorkspaceResponse:
      type: object
      properties:
        workspace:
          allOf:
            - $ref: '#/components/schemas/livekit.publicapi.workspaces.v1.Workspace'
          title: workspace
      title: UpdateWorkspaceResponse
      additionalProperties: false
    livekit.publicapi.workspaces.v1.Workspace:
      type: object
      properties:
        id:
          type: string
          title: id
          description: The workspace ID (`wo_...`).
        name:
          type: string
          title: name
          description: The workspace name.
        creatorId:
          type: string
          title: creator_id
          description: The user who created the workspace.
        organizationId:
          type: string
          title: organization_id
          description: The organization the workspace belongs to.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
          description: When the workspace was created.
        preferences:
          allOf:
            - $ref: '#/components/schemas/livekit.publicapi.workspaces.v1.WorkspacePreferences'
          title: preferences
          description: The settings for the workspace.
      title: Workspace
      additionalProperties: false
      description: |-
        A LiveKit Cloud workspace. Members and invites are separate list resources
         and are not embedded here.
    livekit.publicapi.workspaces.v1.WorkspaceInvite:
      type: object
      properties:
        workspaceId:
          type: string
          title: workspace_id
          description: The workspace the invite is to (`wo_...`).
        email:
          type: string
          title: email
          description: The email address the invite was sent to.
        role:
          type: integer
          title: role
          format: int32
          description: |-
            Access level the invitee takes on the workspace: 0 invited, 1 read,
             2 write, 3 admin.
        inviteToken:
          type: string
          title: invite_token
          description: |-
            The token that identifies the invite. The invitee answers with it.
             Only `GetInvite` returns it, to the invitee who asks with it. `ListInvites`
             leaves it empty. `CreateInvite` returns the token of the invite that it
             creates.
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
          description: When the invite stops working.
      title: WorkspaceInvite
      additionalProperties: false
      description: A pending email invite to a workspace.
    livekit.publicapi.workspaces.v1.WorkspaceMember:
      type: object
      properties:
        workspaceId:
          type: string
          title: workspace_id
          description: The workspace the membership is on (`wo_...`).
        userId:
          type: string
          title: user_id
          description: The user who holds the membership.
        email:
          type: string
          title: email
          description: The email address on the user account.
        role:
          type: integer
          title: role
          format: int32
          description: 'The role of the member: `0` invited, `1` read, `2` write, `3` admin.'
      title: WorkspaceMember
      additionalProperties: false
      description: A user's membership on a workspace.
    livekit.publicapi.workspaces.v1.WorkspacePreferences:
      type: object
      properties:
        hipaaCompliant:
          type: boolean
          title: hipaa_compliant
      title: WorkspacePreferences
      additionalProperties: false
      description: The settings of a workspace.
paths:
  /v0/project-invites/{inviteToken}:
    get:
      tags:
        - ProjectService
      summary: GetInvite
      operationId: ProjectService_GetInvite
      parameters:
        - name: inviteToken
          in: path
          description: |-
            The invite token. The link in the invite email carries it as the `t` query
             parameter, and `ListInvites` returns it.
          required: true
          schema:
            type: string
            title: invite_token
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/livekit.publicapi.projects.v1.GetInviteResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
  /v0/project-invites/{inviteToken}:answer:
    post:
      tags:
        - ProjectService
      summary: AnswerInvitation
      operationId: ProjectService_AnswerInvitation
      parameters:
        - name: inviteToken
          in: path
          description: |-
            The invite token. The link in the invite email carries it as the `t` query
             parameter, and `ListInvites` returns it.
          required: true
          schema:
            type: string
            title: invite_token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                accept:
                  type: boolean
                  title: accept
                  description: True accepts the invite; false declines it.
              title: AnswerInvitationRequest
              additionalProperties: false
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/livekit.publicapi.projects.v1.AnswerInvitationResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
  /v0/projects:
    get:
      tags:
        - ProjectService
      summary: ListProjects
      operationId: ProjectService_ListProjects
      parameters:
        - name: page.cursor
          in: query
          description: |-
            The cursor of the page to return: the `nextCursor` of the previous page.
             When empty, the list starts at the first item.
          schema:
            type: string
            title: cursor
        - name: page.pageSize
          in: query
          description: |-
            The maximum number of items to return. When 0, the list uses its default
             page size.
          schema:
            type: integer
            title: page_size
            format: int32
        - name: workspaceId
          in: query
          description: |-
            The workspace to list projects from. Private projects that you are not a
             member of are left out. When `workspaceId` and `memberId` are both empty,
             the response lists the projects that you are a member of. If you set both,
             the request fails with `InvalidArgument`.
          schema:
            type: string
            title: workspace_id
        - name: memberId
          in: query
          description: |-
            The member to list projects for. It must be your own user ID. Another user
             ID returns `PermissionDenied`.
          schema:
            type: string
            title: member_id
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/livekit.publicapi.projects.v1.ListProjectsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
    post:
      tags:
        - ProjectService
      summary: CreateProject
      operationId: ProjectService_CreateProject
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/livekit.publicapi.projects.v1.CreateProjectRequest'
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/livekit.publicapi.projects.v1.CreateProjectResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
  /v0/projects/{projectId}:
    get:
      tags:
        - ProjectService
      summary: GetProject
      operationId: ProjectService_GetProject
      parameters:
        - name: projectId
          in: path
          description: The project ID (`p_...`).
          required: true
          schema:
            type: string
            title: project_id
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/livekit.publicapi.projects.v1.GetProjectResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
    delete:
      tags:
        - ProjectService
      summary: DeleteProject
      operationId: ProjectService_DeleteProject
      parameters:
        - name: projectId
          in: path
          description: The project ID (`p_...`).
          required: true
          schema:
            type: string
            title: project_id
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/livekit.publicapi.projects.v1.DeleteProjectResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/google.rpc.Status'
    patch:
      tags:
        - ProjectService
      summary: UpdateProject
      operationId: ProjectService_UpdateProject
      parameters:
        - name: projectId
          in: path
          description: The project ID (`p_...`).
          required: true
          schema:
            type: string
            title: project_id
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type:
                    - string
                    - "null"
                  title: name
                  description: The project name.
                subdomain:
                  type:
                    - string
                    - "null"
                  title: subdomain
                  description: The project subdomain, which forms the server URL.
                customDomain:
                  type:
                    - string
                    - "null"
                  title: custom_domain
                  description: A custom domain to add to the project.
                enableAnalytics:
                  type:
                    - boolean
                    - "null"
                  title: enable_analytics
                enableAutoCreate:
                  type:
                    - boolean
                    - "null"
                  title: enable_auto_create
                  description: |-
                    True lets the first participant to join a room that does not yet exist
                     create it.
                enableRemoteUnmute:
                  type:
                    - boolean
                    - "null"
                  title: enable_remote_unmute
                  description: True lets an admin unmute the tracks of another participant.
                enabledCodecs:
                  type: array
                  items:
                    type: string
                  title: enabled_codecs
                  description: The media codecs the project allows, by MIME type, such as `video/VP9`.
                egressClusterId:
                  type:
                    - string
                    - "null"
                  title: egress_cluster_id
                  description: |-
                    The egress cluster for the project. Only LiveKit staff can change it. For
                     any other caller, a value that differs from the current one returns
                     `PermissionDenied`.
                enableHostedAgents:
                  type:
                    - boolean
                    - "null"
                  title: enable_hosted_agents
                  description: |-
                    True when hosted agents are enabled for the project. Only LiveKit staff can
                     change it. For any other caller, a value that differs from the current one
                     returns `PermissionDenied`.
                enableUserDataRecording:
                  type:
                    - boolean
                    - "null"
                  title: enable_user_data_recording
                  description: |-
                    When true, the project records traces, transcripts, and audio from agent
                     sessions for agent observability. Data recorded earlier stays readable.
                requireExplicitDispatch:
                  type:
                    - boolean
                    - "null"
                  title: require_explicit_dispatch
                  description: |-
                    True rejects an agent server that registers without an explicit agent
                     name.
                isPrivate:
                  type:
                    - boolean
                    - "null"
                  title: is_private
                  description: |-
                    True gives the project its own member list instead of the members of its
                     workspace.
                members:
                  type: array
                  items:
                    $ref: '#/components/schemas/livekit.publicapi.projects.v1.CreateProjectMember'
                  title: members
                  description: |-
                    The members to keep when the project becomes private. You keep the admin
                     role.
                enablePiiRedaction:
                  type:
                    - boolean
                    - "null"
                  title: enable_pii_redaction
                  description: True redacts PII from the recorded session data.
                piiRedactionCategories:
                  type: array
                  items:
                    $ref: '#/components/schemas/cloud_protocol.PIIRedactionCategory'
                  title: pii_redaction_categories
                  description: |-
                    The categories to redact. A non-empty list replaces the saved categories.
                     The API ignores an empty list, so you cannot clear the categories this
                     way. When you turn on redaction and the project has no saved categories,
                     the API applies the default categories.
                enableInferenceRegionRestriction:
                  type:
                    - boolean
                    - "null"
                  title: enable_inference_region_restriction
                  description: |-
                    True restricts inference to the models in the same data region as the
                     project.
                hideOnboarding:
                  type:
                    - boolean
                    - "null"
                  title: hide_onboarding
                  description: True hides the onboarding instructions on the project dashboard.
                discoverableByDomain:
                  type:
                    - boolean
                    - "null"
                  title: discoverable_by_domain
                  description: When true, adds your email domain to the project.
                joinableByDomain:
                  type:
                    - boolean
                    - "null"
                  title: joinable_by_domain
                  description: When true, adds your email domain to the project.
                hideSampleAppGallery:
                  type:
                    - boolean
                    - "null"
                  title: hide_sample_app_gallery
                  description: True hides the sample app gallery on the project dashboard.
                disableTokenEndpoint:
                  type:
                    - boolean
                    - "null"
                  title: disable_token_endpoint
                  description: True turns off the sandbox token endpoint for the project.
                tokenEndpointKey:
                  type:
                    - string
                    - "null"
                  title: token_endpoint_key
                sfuAllowPause:
                  type:
                    - boolean
                    - "null"
                  title: sfu_allow_pause
                  description: True lets the SFU pause video tracks when subscribers are congested.
                enableEgressBackupStorage:
                  type:
                    - boolean
                    - "null"
                  title: enable_egress_backup_storage
                  description: |-
                    True keeps an egress that fails to upload in LiveKit backup storage for 7
                     days.
                enableEgressAutoRetry:
                  type:
                    - boolean
                    - "null"
                  title: enable_egress_auto_retry
                featureFlags:
                  type: object
                  title: feature_flags
                  additionalProperties:
                    type: string
                    title: value
                roomConfigsToUpsert:
                  type: array
                  items:
                    $ref: '#/components/schemas/livekit.RoomConfiguration'
                  title: room_configs_to_upsert
                  description: |-
                    Room configurations to add to the project. A configuration replaces the
                     one with the same name. A configuration without a name is ignored.
                roomConfigsToDelete:
                  type: array
                  items:
                    type: string
                  title: room_configs_to_delete
                  description: The names of the room configurations to remove from the project.
                pinnedRegions:
                  allOf:
                    - $ref: '#/components/schemas/livekit.publicapi.projects.v1.PinnedRegions'
