    livekit.SimulationRun:
      type: object
      properties:
        id:
          type: string
          title: id
        projectId:
          type: string
          title: project_id
        status:
          allOf:
            - $ref: '#/components/schemas/livekit.SimulationRun.Status'
          title: status
        agentDescription:
          type: string
          title: agent_description
        error:
          type: string
          title: error
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/livekit.SimulationRun.Job'
          title: jobs
        agentName:
          type: string
          title: agent_name
        scenarioGroup:
          allOf:
            - $ref: '#/components/schemas/livekit.ScenarioGroup'
          title: scenario_group
        endedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: ended_at
        jobCount:
          type: integer
          title: job_count
          format: int32
        passedCount:
          type: integer
          title: passed_count
          format: int32
        failedCount:
          type: integer
          title: failed_count
          format: int32
        numSimulations:
          type: integer
          title: num_simulations
          format: int32
        usage:
          allOf:
            - $ref: '#/components/schemas/livekit.SimulationRun.Usage'
          title: usage
          description: Aggregate usage across all jobs in this run (sum of Job.usage).
        concurrency:
          type: integer
          title: concurrency
          format: int32
          description: Maximum simulate jobs running in parallel for this run (0 = server default).
        mode:
          allOf:
            - $ref: '#/components/schemas/livekit.SimulationMode'
          title: mode
          description: Conversation mode for every job in this run; unspecified = TEXT.
        metrics:
          allOf:
            - $ref: '#/components/schemas/livekit.SimulationRun.RunMetrics'
          title: metrics
          description: Run-level aggregates over this run's jobs.
        summaryZstd:
          type: string
          title: summary_zstd
          format: byte
          description: |-
            zstd-compressed SimulationRunSummary: decompress, then proto.Unmarshal.
             Compressed by default so the blob ships as-is on every hop.
        issueCount:
          type:
            - integer
            - "null"
          title: issue_count
          format: int32
          description: |-
            How many issues the stored summary flagged. Present only once a summary
             landed — absent and 0 differ ("never summarized" vs "no issues") — and
             List responses carry it without the summary blob itself.
        ci:
          oneOf:
            - $ref: '#/components/schemas/livekit.SimulationRun.CI'
            - type: "null"
          title: ci
          description: The pipeline this run came from; unset when it did not come from one.
        sampling:
          oneOf:
            - $ref: '#/components/schemas/livekit.SimulationRun.SamplingOptions'
            - type: "null"
          title: sampling
          description: Absent when the run ran each scenario once and required it to pass.
