            $ref: '#/components/schemas/livekit.publicapi.projects.v1.ProjectInvite'
          title: items
        pageInfo:
          allOf:
            - $ref: '#/components/schemas/livekit.publicapi.common.v1.PageInfo'
          title: page_info
      title: ListInvitesResponse
      additionalProperties: false
    livekit.publicapi.projects.v1.ListKeysRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
          description: The project ID (`p_...`).
        includeAgentKeys:
          type: boolean
          title: include_agent_keys
          description: |-
            When true, the list includes the keys of cloud agents. By default, the
             list does not include them.
        page:
          allOf:
            - $ref: '#/components/schemas/livekit.publicapi.common.v1.PageRequest'
          title: page
          description: |-
            The page to return. `pageSize` defaults to 100, and the API clamps a
             larger value to 1000. A malformed cursor returns `InvalidArgument`.
        ownerId:
          type: string
          title: owner_id
          description: |-
            The ID of a user. Returns only the keys that this user owns. When empty,
             returns the keys of every owner and the keys with no owner.
      title: ListKeysRequest
      additionalProperties: false
    livekit.publicapi.projects.v1.ListKeysResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/livekit.publicapi.projects.v1.AccessKey'
          title: items
        pageInfo:
          allOf:
            - $ref: '#/components/schemas/livekit.publicapi.common.v1.PageInfo'
          title: page_info
      title: ListKeysResponse
      additionalProperties: false
    livekit.publicapi.projects.v1.ListMembersRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
          description: The project ID (`p_...`).
        page:
          allOf:
            - $ref: '#/components/schemas/livekit.publicapi.common.v1.PageRequest'
          title: page
          description: |-
            The page to return. `pageSize` defaults to 100, and the API clamps a
             larger value to 1000. A malformed cursor returns `InvalidArgument`.
      title: ListMembersRequest
      additionalProperties: false
    livekit.publicapi.projects.v1.ListMembersResponse:
