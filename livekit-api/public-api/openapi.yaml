            type: string
            title: agent_name
        - name: mode
          in: query
          description: A conversation mode. Counts only the runs in this mode.
          schema:
            oneOf:
              - $ref: '#/components/schemas/livekit.SimulationMode'
              - type: "null"
            title: mode
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
