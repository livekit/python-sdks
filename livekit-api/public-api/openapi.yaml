          type: string
          title: code_entrypoint
      title: Request
      additionalProperties: false
    livekit.SimulationRun.ConfirmSourceUpload.Response:
      type: object
      title: Response
      additionalProperties: false
    livekit.SimulationRun.Counts:
      type: object
      title: Counts
      additionalProperties: false
      description: |-
        Counts of the runs `List` would return over the same window, bucketed by
         created_at instead of paginated.
    livekit.SimulationRun.Counts.Bucket:
      type: object
      properties:
        bucketStart:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: bucket_start
        count:
          type: string
          title: count
          format: int64
      title: Bucket
      additionalProperties: false
    livekit.SimulationRun.Counts.Request:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        startTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: start_time
          description: |-
            Both bounds required: a bucketed scan of a project's whole history is
             never what a caller wants.
        endTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: end_time
        status:
          oneOf:
            - $ref: '#/components/schemas/livekit.SimulationRun.Status'
            - type: "null"
          title: status
          description: |-
            Applied as `List` applies it: a filter the rows honour and the bars
             above them drop would make the histogram an answer about a wider set.
        agentName:
          type:
            - string
            - "null"
          title: agent_name
        mode:
          oneOf:
            - $ref: '#/components/schemas/livekit.SimulationMode'
            - type: "null"
          title: mode
      title: Request
      additionalProperties: false
    livekit.SimulationRun.Counts.Response:
      type: object
      properties:
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/livekit.SimulationRun.Counts.Bucket'
          title: buckets
          description: |-
            Buckets holding at least one run, ascending by bucket_start. Empty
             buckets are omitted; each run lands in exactly one bucket, so the
             counts sum to the number of runs in the window.
        interval:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Duration'
          title: interval
          description: |-
            The bucket width the server chose from the window, so the client
             zero-fills the omitted buckets on the grid the counts were built on.
      title: Response
      additionalProperties: false
    livekit.SimulationRun.Create:
      type: object
      title: Create
      additionalProperties: false
    livekit.SimulationRun.Create.Request:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        agentName:
          type: string
          title: agent_name
        numSimulations:
          type: integer
          title: num_simulations
          format: int32
        region:
          type: string
          title: region
        scenarioGroup:
          oneOf:
            - $ref: '#/components/schemas/livekit.ScenarioGroup'
            - type: "null"
          title: scenario_group
          description: |-
            When set, run these scenarios (loaded from a scenarios.yaml).
             When unset, generate num_simulations scenarios from the uploaded agent source.
        concurrency:
          type:
            - integer
            - "null"
          title: concurrency
          format: int32
          description: |-
            Maximum simulate jobs running in parallel for this run. Clamped to the
             project's concurrency quota; 0/unset uses the server default.
        mode:
          allOf:
            - $ref: '#/components/schemas/livekit.SimulationMode'
          title: mode
          description: Conversation mode for every job in this run; unspecified = TEXT.
        backgroundNoise:
          type: boolean
          title: background_noise
          description: Impairments applied to the simulated user's audio; AUDIO mode only.
        lowQualityMicrophone:
          type: boolean
          title: low_quality_microphone
        packetLoss:
          type: boolean
          title: packet_loss
        ci:
          oneOf:
            - $ref: '#/components/schemas/livekit.SimulationRun.CI'
            - type: "null"
          title: ci
        sampling:
          oneOf:
            - $ref: '#/components/schemas/livekit.SimulationRun.SamplingOptions'
            - type: "null"
          title: sampling
          description: |-
            Absent runs each scenario once and requires it to pass. Requires
             scenario_group. The run fails if any scenario fails; pass@k and
             pass^k report over scenarios and neither gates.
      title: Request
      additionalProperties: false
    livekit.SimulationRun.Create.Response:
