          title: preferences
          description: The UI and feature settings for the project.
        enabledCodecs:
          type: array
          items:
            type: string
          title: enabled_codecs
          description: The media codecs the project allows, by MIME type, such as `video/VP9`.
        pinnedRegions:
          type: array
          items:
            type: string
          title: pinned_regions
          description: The regions the project pins its traffic to. Empty leaves it unpinned.
        egressClusterId:
          type: string
          title: egress_cluster_id
          description: The egress cluster the project runs egress on.
        enableSafeMode:
          type: boolean
          title: enable_safe_mode
        enableUserDataRecording:
          type: boolean
          title: enable_user_data_recording
          description: |-
            True when the project records traces, transcripts, and audio from agent
             sessions for agent observability.
        enableUserDataTraining:
          type: boolean
          title: enable_user_data_training
          description: |-
            True lets LiveKit use the observability data from this project to improve
             models and services.
        userDataRegion:
          type: string
          title: user_data_region
          description: |-
            The region where the project stores and processes session analytics and
             agent observability data. It is set when the project is created and cannot
             be changed.
        userDataLifetimeDays:
          type: integer
          title: user_data_lifetime_days
          format: int32
        enableSipCustomDomain:
          type: boolean
          title: enable_sip_custom_domain
        requireExplicitDispatch:
          type: boolean
          title: require_explicit_dispatch
          description: |-
            True rejects an agent server that registers without an explicit agent
             name, which keeps an accidental auto-dispatch server from connecting.
        isPrivate:
          type: boolean
          title: is_private
          description: |-
            True when the project keeps its own member list instead of taking the
             members of its workspace.
        enablePiiRedaction:
          type: boolean
          title: enable_pii_redaction
          description: True redacts PII from the recorded session data.
        piiRedactionCategories:
          type: array
          items:
            $ref: '#/components/schemas/cloud_protocol.PIIRedactionCategory'
