      properties:
        workspaceId:
          type: string
          title: workspace_id
          description: The workspace ID (`wo_...`).
        email:
          type: string
          title: email
          description: The email address to invite.
        role:
          type: integer
          title: role
          format: int32
          description: 'Access level to grant: 1 read, 2 write, 3 admin.'
      title: CreateInviteRequest
      additionalProperties: false
    livekit.publicapi.workspaces.v1.CreateInviteResponse:
      type: object
      properties:
        workspaceId:
          type: string
          title: workspace_id
          description: The workspace the invite is to (`wo_...`).
        inviteToken:
          type: string
          title: invite_token
          description: The token that identifies the invite. The invitee answers with it.
      title: CreateInviteResponse
      additionalProperties: false
    livekit.publicapi.workspaces.v1.CreateProjectRequest:
      type: object
      properties:
        workspaceId:
          type: string
          title: workspace_id
          description: The workspace ID (`wo_...`).
        project:
          allOf:
            - $ref: '#/components/schemas/livekit.publicapi.projects.v1.CreateProjectRequest'
          title: project
          description: |-
            The project to create. Its `workspaceId` must be empty or match the
             `workspaceId` of this request. Otherwise, the API returns
             `InvalidArgument`.
      title: CreateProjectRequest
      additionalProperties: false
    livekit.publicapi.workspaces.v1.CreateWorkspaceRequest:
      type: object
      properties:
        name:
          type: string
          title: name
          description: The workspace name.
        organizationId:
          type: string
          title: organization_id
          description: The ID of an organization to associate the workspace with. Optional.
      title: CreateWorkspaceRequest
      additionalProperties: false
      description: |-
        The workspace to create. You cannot set workspace preferences here. LiveKit
         staff set them, and they apply to every project in the workspace.
    livekit.publicapi.workspaces.v1.CreateWorkspaceResponse:
      type: object
      properties:
        workspace:
          allOf:
            - $ref: '#/components/schemas/livekit.publicapi.workspaces.v1.Workspace'
          title: workspace
      title: CreateWorkspaceResponse
      additionalProperties: false
    livekit.publicapi.workspaces.v1.DeleteInviteRequest:
      type: object
      properties:
        workspaceId:
          type: string
          title: workspace_id
