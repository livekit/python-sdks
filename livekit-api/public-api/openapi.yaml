        enableAnalytics:
          type: boolean
          title: enable_analytics
        analyticsAccessKey:
          type: string
          title: analytics_access_key
        enableAutoCreate:
          type: boolean
          title: enable_auto_create
          description: |-
            True lets the first participant to join a room that does not yet exist
             create it.
        enableRemoteUnmute:
          type: boolean
          title: enable_remote_unmute
          description: True lets an admin unmute the tracks of another participant.
        enableEnhancedNoiseCancellation:
          type: boolean
          title: enable_enhanced_noise_cancellation
          description: True applies enhanced noise cancellation to inbound audio.
