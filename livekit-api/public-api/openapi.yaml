    livekit.publicapi.simulations.v1.SimulationRuns.Counts.Request:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        startTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: start_time
          description: |-
            The start of the window on the creation time of the run, inclusive.
             Required.
        endTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: end_time
          description: |-
            The end of the window on the creation time of the run, exclusive.
             Required. Must be after `startTime`.
        status:
          oneOf:
            - $ref: '#/components/schemas/livekit.SimulationRun.Status'
            - type: "null"
          title: status
          description: A run status. Counts only the runs in this status.
        agentName:
          type:
            - string
            - "null"
          title: agent_name
          description: An agent name. Counts only the runs of the agent with this exact name.
        mode:
          oneOf:
            - $ref: '#/components/schemas/livekit.SimulationMode'
            - type: "null"
          title: mode
          description: A conversation mode. Counts only the runs in this mode.
      title: Request
      additionalProperties: false
    livekit.publicapi.simulations.v1.SimulationRuns.Counts.Response:
      type: object
      properties:
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/livekit.SimulationRun.Counts.Bucket'
          title: buckets
          description: |-
            The buckets that hold at least one run, in ascending order of
             `bucketStart`. The response does not include empty buckets. Each run is
             in exactly one bucket, so the sum of the counts is the number of runs
             in the window.
        interval:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Duration'
          title: interval
          description: |-
            The width of each bucket. The API chooses the width from the window:
             the window has at most 60 buckets, and a bucket is at least one minute
             wide. Use the width to add the empty buckets, with a count of 0.
      title: Response
      additionalProperties: false
    livekit.publicapi.simulations.v1.SimulationRuns.Create.Request:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        agentName:
          type: string
          title: agent_name
          description: |-
            The name of the agent under test. Each job dispatches this agent into
             the simulation room, so the agent must be deployed or running as a
             worker. When empty, the run uses the default agent of the project. The
             run records the name, and `ListSimulationRuns` can filter on it.
        numSimulations:
          type: integer
          title: num_simulations
          format: int32
          description: |-
            The number of scenarios to generate from the agent source when
             `scenarioGroup` is unset.
        region:
          type: string
          title: region
          description: Reserved. Must be empty. The API chooses where the run happens.
        scenarioGroup:
          oneOf:
            - $ref: '#/components/schemas/livekit.ScenarioGroup'
            - type: "null"
          title: scenario_group
          description: |-
            The scenarios to run, with the contents of a `scenarios.yaml` file.
             When set, the run plays only these scenarios and does not generate
             `numSimulations` scenarios. The run needs no source upload and starts
             immediately.
        concurrency:
          type:
            - integer
            - "null"
          title: concurrency
          format: int32
          description: |-
            The maximum number of jobs that run in parallel. The maximum value is
             20. A larger value returns `InvalidArgument`. The concurrency quota of
             the project can run fewer jobs at a time. When unset, the API uses its
             default.
        mode:
          allOf:
            - $ref: '#/components/schemas/livekit.SimulationMode'
          title: mode
          description: The conversation mode of each job. Unset means `TEXT`.
        backgroundNoise:
          type: boolean
          title: background_noise
          description: |-
            When true, the simulated user has background noise. Applies only in
             `AUDIO` mode.
        lowQualityMicrophone:
          type: boolean
          title: low_quality_microphone
          description: |-
            When true, the simulated user has a low-quality microphone. Applies
             only in `AUDIO` mode.
        packetLoss:
          type: boolean
          title: packet_loss
          description: |-
            When true, the audio of the simulated user has packet loss. Applies
             only in `AUDIO` mode.
        ci:
          oneOf:
            - $ref: '#/components/schemas/livekit.SimulationRun.CI'
            - type: "null"
          title: ci
          description: |-
            The CI pipeline that started the run. Use it to link a run to its
             commit.
      title: Request
      additionalProperties: false
    livekit.publicapi.simulations.v1.SimulationRuns.Create.Response:
      type: object
      properties:
        simulationRunId:
          type: string
          title: simulation_run_id
        presignedPostRequest:
          allOf:
            - $ref: '#/components/schemas/livekit.PresignedPostRequest'
          title: presigned_post_request
          description: |-
            The presigned POST to upload the agent source archive that the API
             generates scenarios from. After the upload, call
             `ConfirmSimulationSourceUpload`. Unset when the run has a
             `scenarioGroup`.
      title: Response
      additionalProperties: false
