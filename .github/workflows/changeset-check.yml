# Fails a contributor PR that changes a versioned package without a
# changeset, with a comment that links to a prefilled changeset file.
# The `internal` label (config: [check] exempt_label) skips the check.
# On the release PR, it runs the `[check].publish_dry_run` command of each
# package that the merge releases (build and `twine check`), and fails the
# PR when one fails, before the version reaches main.
name: Changeset check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    # renovate/* PRs are dependency/security updates and never carry changesets
    if: "!startsWith(github.event.pull_request.head.ref, 'renovate/')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0 # the dry run reads the tags to find what the release PR releases
          submodules: true # the sdist of each package includes its submodule
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: livekit/verwalter@14fef9bf275fb347702b083d573e4a1f09bf0ef4 # v0.32.0-rc.2
        with:
          command: check
