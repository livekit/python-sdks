name: Release gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  pull-requests: read

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    steps:
      - name: Check release PR requirements
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [[ "$HEAD_REF" != release/* ]]; then
            echo "Not a release PR, skipping"
            exit 0
          fi

          # The same author that `verwalter gate` accepts ([release].author)
          if [ "$PR_AUTHOR" != "verwalter-release[bot]" ]; then
            echo "::error::Release PRs must be created by verwalter (release-pr.yml or pre-release.yml), not by '$PR_AUTHOR'"
            exit 1
          fi

          # Each push to main regenerates the release branch. Only an
          # approval of the current head commit counts.
          approvals=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            | jq -s --arg sha "$HEAD_SHA" '[add | .[] | select(.commit_id == $sha and (.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED"))] | group_by(.user.login) | map(sort_by(.submitted_at) | last | select(.state == "APPROVED")) | length')
          echo "Approvals of $HEAD_SHA: $approvals"
          if [ "$approvals" -lt 2 ]; then
            echo "::error::Release PRs require at least 2 approvals of the head commit (got $approvals)"
            exit 1
          fi
