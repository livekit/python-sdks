name: Regression - livekit-agents releases encode their session history

# Every published livekit-agents release must still encode its session history with a
# livekit-protocol 1.x build: those releases accept livekit-protocol<2 and are already deployed.

on:
  pull_request:
    branches:
      - main
    paths:
      - livekit-protocol/**
      - tests/protocol/**
      - .github/workflows/regression-agents-session-history.yml
  workflow_dispatch:

jobs:
  regression-agents-session-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Build livekit-protocol
        run: uv build --wheel livekit-protocol -o dist

      - name: Encode a session history with every livekit-agents release
        run: |
          set -euo pipefail
          wheel=$(ls dist/livekit_protocol-*.whl)
          case "$(basename "$wheel")" in
            livekit_protocol-1.*) ;;
            *) echo "livekit-protocol 2+ cannot reach livekit-agents 1.x"; exit 0 ;;
          esac
          versions=$(curl -sf https://pypi.org/pypi/livekit-agents/json | uvx --with packaging python -c '
          import json, sys
          from packaging.version import Version
          releases = json.load(sys.stdin)["releases"]
          print(" ".join(v for v in sorted(releases, key=Version)
                         if releases[v] and not Version(v).is_prerelease
                         and Version("1.7.0") <= Version(v) < Version("2")))')
          failed=""
          for v in $versions; do
            uv venv -q --allow-existing "venv-$v"
            VIRTUAL_ENV="venv-$v" uv pip install -q "livekit-agents==$v"
            VIRTUAL_ENV="venv-$v" uv pip install -q --no-deps --reinstall "$wheel"
            "venv-$v/bin/python" tests/protocol/regression_agents_session_history.py || failed="$failed $v"
          done
          if [ -n "$failed" ]; then
            echo "::error::livekit-agents releases that cannot encode a session history:$failed"
            exit 1
          fi
