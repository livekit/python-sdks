name: Jupyter HTML

on:
  pull_request:
    paths:
      - "livekit-rtc/jupyter-html/**"
      - ".github/workflows/jupyter-html.yml"
  push:
    branches: [main]
    paths:
      - "livekit-rtc/jupyter-html/**"
      - ".github/workflows/jupyter-html.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: livekit-rtc/jupyter-html
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install pnpm
        run: npm install --global pnpm@10.33.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint
        run: pnpm run lint
      - name: Build
        run: pnpm run build
