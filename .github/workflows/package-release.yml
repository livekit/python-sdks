# After a release PR merges: build every package, then tag and create the
# GitHub releases (drafts), then upload to PyPI and make the releases
# public. The step that cannot be undone comes last.
name: Package Release

on:
  # No `branches` filter: an rc PR from pre-release.yml targets the branch
  # the workflow was run on. The `gate` job decides which PRs release.
  pull_request:
    types: [closed]
  # A failed job is re-run with "Re-run failed jobs" on the run itself:
  # that keeps the merge commit. This trigger is for a run that needs a
  # fixed workflow file from the branch. `verwalter release` resumes from
  # the current state and skips what is done.
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or tag to build and publish. Set it to the release tag when the tag exists. Empty is the branch head.
        required: false
        default: ""
      package:
        description: Only this package; always reported to the publish job.
        required: false
        default: ""

# Read-only by default: build jobs run third-party build code and never get
# a write or OIDC token.
permissions:
  contents: read

jobs:
  # Only a run by hand, or a merged release PR or rc PR that verwalter
  # opened: the branch name alone would let any pushed `release/*` branch
  # trigger a publish. The author is `[release].author` in verwalter.toml.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.verwalter.outputs.release }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || inputs.ref || github.sha }}
          fetch-depth: 0
      # Every later job checks out this commit. A branch name in `ref`
      # resolves once, here, and cannot move between the jobs.
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # `verwalter gate` answers yes for every run by hand. The release
      # gate (2 approvals) covers only PRs into main, so a run by hand
      # releases only a commit that is on main.
      - name: Guard the run by hand
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ github.ref }}
          PACKAGE: ${{ inputs.package }}
        run: |
          case "$PACKAGE" in
            ""|livekit|livekit-api|livekit-protocol) ;;
            *) echo "::error::Unknown package '$PACKAGE'. Use livekit, livekit-api or livekit-protocol."; exit 1 ;;
          esac
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from main, not $REF. Set the commit to release with the ref input."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$(git rev-parse HEAD) is not on main. Only a commit on main can be released by hand."
            exit 1
          fi
      - id: verwalter
        uses: livekit/verwalter@9da894a1e4f7d298095a961be60c818afd47905b # v0.32.0-rc.1
        with:
          command: gate

  # ── Builds ───────────────────────────────────────────────────
  build-rtc:
    name: Build RTC wheels (${{ matrix.archs }})
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archs: x86_64
          - os: namespace-profile-default-arm64
            archs: aarch64
          - os: windows-latest
            archs: AMD64
          - os: windows-11-arm
            archs: ARM64
          - os: macos-latest
            archs: x86_64 arm64
    defaults:
      run:
        working-directory: ./livekit-rtc
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          submodules: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        id: setup-python
        with:
          python-version: "3.11"

      - name: Build wheels
        run: pipx run --python '${{ steps.setup-python.outputs.python-path }}' cibuildwheel==3.3.1 --output-dir dist
        env:
          CIBW_ARCHS: ${{ matrix.archs }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-rtc-${{ matrix.os }}
          path: livekit-rtc/dist/*.whl

  build-rtc-sdist:
    name: Build RTC sdist
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./livekit-rtc
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          submodules: true

      - name: Build sdist
        run: |
          pip3 install build
          python3 -m build --sdist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-rtc-sdist
          path: livekit-rtc/dist/*.tar.gz

  build:
    name: Build ${{ matrix.package }}
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [livekit-api, livekit-protocol]
    defaults:
      run:
        working-directory: ./${{ matrix.package }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          submodules: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7

      - name: Build wheel & sdist
        run: |
          pip3 install build wheel
          python3 -m build --wheel --sdist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-${{ matrix.package }}
          path: |
            ${{ matrix.package }}/dist/*.whl
            ${{ matrix.package }}/dist/*.tar.gz

  # ── Tag & GitHub releases ────────────────────────────────────
  release:
    needs: [gate, build-rtc, build-rtc-sdist, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.verwalter.outputs.released }}
      releases: ${{ steps.verwalter.outputs.releases }}
      docs: ${{ steps.docs.outputs.tags }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # The merge commit itself: a push to main right after the merge
          # must not move the tags.
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
      - id: verwalter
        uses: livekit/verwalter@9da894a1e4f7d298095a961be60c818afd47905b # v0.32.0-rc.1
        with:
          command: release
          args: ${{ inputs.package && format('--package {0}', inputs.package) || '' }}
      # The docs site holds one version per package. Only the newest final
      # tag of a package may deploy: not an rc, and not an older version
      # that a run by hand reports again. Output: {"<package>": "<tag>"}.
      - id: docs
        env:
          RELEASES: ${{ steps.verwalter.outputs.releases }}
        run: |
          git fetch -q --tags --force origin
          docs='{}'
          while read -r pkg tag; do
            [ -n "$pkg" ] || continue
            newest=$(git tag --list "${tag%-v*}-v*" | grep -v -- '-rc' | sort -V | tail -n 1)
            if [ "$tag" = "$newest" ]; then
              docs=$(jq -c --arg p "$pkg" --arg t "$tag" '. + {($p): $t}' <<< "$docs")
            else
              echo "No docs for $tag: $newest is newer"
            fi
          done < <(jq -r '.[] | select(.prerelease | not) | "\(.package) \(.tag)"' <<< "${RELEASES:-[]}")
          echo "tags=$docs" >> "$GITHUB_OUTPUT"

  # ── PyPI ─────────────────────────────────────────────────────
  # `verwalter publish` runs the publish command of verwalter.toml for each
  # released package: dependencies first, a failure blocks only its
  # dependents, a package whose source changed since its tag fails, and a
  # draft goes public only when PyPI has its sdist, which uploads last.
  publish:
    needs: [gate, release]
    if: needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write   # the tool makes the draft releases public
      id-token: write   # trusted publishing and the attestations
    outputs:
      docs: ${{ steps.docs.outputs.tags }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0  # tags decide what is published

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: dist-rtc-*
          path: dist/livekit
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist-livekit-api
          path: dist/livekit-api
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist-livekit-protocol
          path: dist/livekit-protocol

      - name: List distributions
        run: ls -laR dist/

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Upload to PyPI and make the GitHub releases public
        uses: livekit/verwalter@9da894a1e4f7d298095a961be60c818afd47905b # v0.32.0-rc.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          command: publish
          releases: ${{ needs.release.outputs.releases }}

      # Docs only for a release that is public now: a failed or blocked
      # package keeps its draft, and the others still get their docs.
      - id: docs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATES: ${{ needs.release.outputs.docs }}
        run: |
          [ -n "$CANDIDATES" ] || CANDIDATES='{}'
          docs='{}'
          while read -r pkg tag; do
            [ -n "$pkg" ] || continue
            if [ "$(gh release view "$tag" --json isDraft -q .isDraft)" = "false" ]; then
              docs=$(jq -c --arg p "$pkg" --arg t "$tag" '. + {($p): $t}' <<< "$docs")
            else
              echo "No docs for $tag: its release is still a draft"
            fi
          done < <(jq -r 'to_entries[] | "\(.key) \(.value)"' <<< "$CANDIDATES")
          echo "tags=$docs" >> "$GITHUB_OUTPUT"

  # The end state, asserted: fails when a tag is not on the remote, a GitHub
  # release is missing or still a draft, or PyPI does not have the sdist.
  # TODO(livekit/verwalter#138): fails for every rc until exists_url has a
  # PEP 440 placeholder (see verwalter.toml).
  verify:
    needs: [gate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # reads only. A draft release is visible only with write access
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
      - uses: livekit/verwalter@9da894a1e4f7d298095a961be60c818afd47905b # v0.32.0-rc.1
        with:
          command: status
          args: --check

  # ── Docs (the newest final version only, once public, built from its tag) ─
  docs-rtc:
    name: Build RTC docs
    needs: [gate, publish]
    if: ${{ !cancelled() && fromJSON(needs.publish.outputs.docs || '{}')['livekit'] != null }}
    uses: ./.github/workflows/build-docs.yml
    with:
      package_dir: livekit-rtc
      package_name: livekit.rtc
      ref: ${{ fromJSON(needs.publish.outputs.docs)['livekit'] }}
    secrets: inherit

  docs-api:
    name: Build API docs
    needs: [gate, publish]
    if: ${{ !cancelled() && fromJSON(needs.publish.outputs.docs || '{}')['livekit-api'] != null }}
    uses: ./.github/workflows/build-docs.yml
    with:
      package_dir: livekit-api
      package_name: livekit.api
      ref: ${{ fromJSON(needs.publish.outputs.docs)['livekit-api'] }}
    secrets: inherit

  docs-protocol:
    name: Build Protocol docs
    needs: [gate, publish]
    if: ${{ !cancelled() && fromJSON(needs.publish.outputs.docs || '{}')['livekit-protocol'] != null }}
    uses: ./.github/workflows/build-docs.yml
    with:
      package_dir: livekit-protocol
      package_name: livekit.protocol
      ref: ${{ fromJSON(needs.publish.outputs.docs)['livekit-protocol'] }}
    secrets: inherit
